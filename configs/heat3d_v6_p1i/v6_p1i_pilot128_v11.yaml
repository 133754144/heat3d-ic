      background_k_xyz_W_mK: [4.0, 4.0, 4.0]
      sampling: {distribution: isotropic_log_uniform, range_W_mK: [1.33, 7.5]}
    - id: silicon_die_upper
      thickness_m: 0.00015
      z_intervals: 8
      material_meaning: active silicon die background
      background_k_xyz_W_mK: [120.0, 120.0, 120.0]
      sampling: {distribution: isotropic_linear, range_W_mK: [100.0, 150.0]}
    - id: tim_to_spreader
      thickness_m: 0.00005
      z_intervals: 4
      material_meaning: thermal interface material
      background_k_xyz_W_mK: [4.0, 4.0, 4.0]
      sampling: {distribution: isotropic_log_uniform, range_W_mK: [1.33, 7.5]}
    - id: spreader
      thickness_m: 0.001
      z_intervals: 8
      material_meaning: copper heat spreader
      background_k_xyz_W_mK: [400.0, 400.0, 400.0]
      sampling: {distribution: isotropic_linear, range_W_mK: [385.0, 400.0]}
