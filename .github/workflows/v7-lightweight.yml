name: V7 lightweight checks

on:
  push:
    branches: [main, research/v7]
  pull_request:
    branches: [main, research/v7]

jobs:
  runtime-import-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Stable runtime import and unit tests
        run: python -m unittest tests.test_heat3d_runtime tests.test_heat3d_v7_training

  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned CPU CI dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q rigno scripts tests
      - name: Validate JSON documents
        run: >-
          python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8'))
          for p in pathlib.Path('.').rglob('*.json') if '.git' not in p.parts]"
      - name: Static production import audit
        run: python tools/check_v7_production_imports.py
      - name: Validate V7 training control plane
        run: python tools/check_v7_training_control_plane.py
      - name: Formal trainer dry-run
        run: python -m scripts.run_heat3d_v7_formal_training --dry-run
