schema_version: heat3d_v6_p1i_continuous_dataset_v1
artifact_prefix: v6_p1i_pilot128_v11
dataset_id: heat3d_v6_p1i_continuous_physics128_v11
sample_id_prefix: v6p1i11_
stage: pilot128
sample_count: 128
split_counts: {train: 96, valid_iid: 16, test_iid: 16}
split_assignment:
  method: frozen_balanced_pre_solve_assignment_v1
  assignment_path: configs/heat3d_v6_p1i/v6_p1i_pilot128_v11_split_manifest.json
  target_values_used: false
sampling:
  method: scrambled_sobol
  seed: 612813
  dimensions: 1024
  scramble: true
  power_W:
    distribution: monotonic_curved_severity_top_h_power_law_with_independent_jitter
    base_range_W: [2.8, 10.9]
    severity_curve_exponent: 0.9
    top_h_reference_W_m2K: 894.4271909999159
    top_h_exponent: 0.68
    independent_multiplier:
      distribution: log_uniform
      range: [0.75, 1.25]
    allowed_range_W: [1.7, 20.0]
    calibration_scope: frozen global rule; no per-sample Rth or temperature input
  top_h_W_m2K:
    distribution: log_uniform
    range: [500.0, 1600.0]
  bottom_h_W_m2K:
    distribution: log_uniform
    range: [20.0, 200.0]
  source_count: {range_inclusive: [3, 10]}
  source_planform_fraction:
    width_range: [0.08, 0.14]
    height_range: [0.08, 0.14]
    center_margin: 0.06
    same_family_gap: 0.008
    size_severity_weight: 0.0
  source_layer_upper_probability:
    distribution: continuous_uniform
    range: [0.25, 0.75]
  source_power_heterogeneity:
    distribution: log_uniform_multiplier
    range: [0.65, 1.35]
  k_region_count: {range_inclusive: [2, 8]}
  k_region_planform_fraction:
    width_range: [0.085, 0.18]
    height_range: [0.085, 0.18]
    center_margin: 0.04
    same_family_gap: 0.006
  local_k_W_mK:
    distribution: log_uniform
    range: [20.0, 400.0]
physics:
  footprint_m: [0.010, 0.010]
  solver_mesh_intervals_xyz: [64, 64, 56]
  ambient_K: 300.0
  boundary_conditions:
    top: {type: robin}
    bottom: {type: robin}
    sides: {type: adiabatic}
  contact: {type: perfect, R_contact_m2K_W: 0.0}
  layers_bottom_to_top:
    - id: pcb_fr4_equivalent
      thickness_m: 0.0016
      z_intervals: 8
      material_meaning: via-bearing FR-4 PCB equivalent
      background_k_xyz_W_mK: [0.8, 0.8, 0.3]
      sampling: {distribution: correlated_log_uniform_axes, kxy_range_W_mK: [0.64, 1.0], kz_range_W_mK: [0.24, 0.375]}
    - id: bt_substrate_with_vias
      thickness_m: 0.001
      z_intervals: 8
      material_meaning: via-bearing BT substrate equivalent
      background_k_xyz_W_mK: [0.2, 0.2, 0.49]
      sampling: {distribution: correlated_log_uniform_axes, kxy_range_W_mK: [0.16, 0.25], kz_range_W_mK: [0.392, 0.6125]}
    - id: silicon_interposer_tsv_0p1
      thickness_m: 0.0001
      z_intervals: 4
      material_meaning: silicon interposer with correlated TSV effective conductivity
      background_k_xyz_W_mK: [148.3, 148.3, 151.0]
      sampling: {distribution: correlated_linear_axes, kxy_range_W_mK: [120.0, 150.0], kz_range_W_mK: [120.0, 155.0]}
    - id: bump_underfill_under_interposer
      thickness_m: 0.000075
      z_intervals: 4
      material_meaning: bump and underfill effective layer
      background_k_xyz_W_mK: [0.6, 0.6, 4.9]
      sampling: {distribution: correlated_log_uniform_axes, kxy_range_W_mK: [0.48, 0.75], kz_range_W_mK: [3.92, 6.125]}
    - id: silicon_die_lower
      thickness_m: 0.00015
      z_intervals: 8
